<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión e Impuestos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Sistema de Declaración de Impuestos</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row g-4">
            
            <!-- Columna Izquierda: Formularios -->
            <div class="col-lg-5">
                
                <!-- Card 1: Registro de Clientes -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Administración de Clientes</h5>
                    </div>
                    <div class="card-body">
                        <form id="formCliente">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre o Razón Social *</label>
                                <input type="text" class="form-control" id="nombre" required placeholder="Ej. Comercial Los Ángeles S.A.">
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="nit" class="form-label">NIT *</label>
                                    <input type="text" class="form-control" id="nit" required placeholder="0614-000000-000-0">
                                </div>
                                <div class="col-md-6">
                                    <label for="nrc" class="form-label">NRC</label>
                                    <input type="text" class="form-control" id="nrc" placeholder="123456-7">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="tipo_empresa" class="form-label">Tipo de Contribuyente *</label>
                                <select class="form-select" id="tipo_empresa" required>
                                    <option value="">Seleccione una opción...</option>
                                    <option value="Natural">Persona Natural</option>
                                    <option value="Jurídica">Persona Jurídica</option>
                                    <option value="Gran Contribuyente">Gran Contribuyente</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" placeholder="San Salvador">
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="telefono" placeholder="2222-0000">
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Cliente</button>
                        </form>
                    </div>
                </div>

                <!-- Card 2: Cálculo de Impuesto por Período -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">Registro del Impuesto del Período</h5>
                    </div>
                    <div class="card-body">
                        <form id="formImpuesto">
                            <div class="mb-3">
                                <label for="selectCliente" class="form-label">Seleccionar Cliente *</label>
                                <select class="form-select" id="selectCliente" required>
                                    <option value="">Cargando clientes...</option>
                                </select>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="mes" class="form-label">Mes *</label>
                                    <input type="number" class="form-control" id="mes" min="1" max="12" required placeholder="1 - 12">
                                </div>
                                <div class="col-md-6">
                                    <label for="anio" class="form-label">Año *</label>
                                    <input type="number" class="form-control" id="anio" min="2000" max="2099" value="2026" required>
                                </div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="monto_activos" class="form-label">Monto Activos ($) *</label>
                                    <input type="number" step="0.01" class="form-control" id="monto_activos" required placeholder="0.00">
                                </div>
                                <div class="col-md-6">
                                    <label for="monto_ingresos" class="form-label">Monto Ingresos ($) *</label>
                                    <input type="number" step="0.01" class="form-control" id="monto_ingresos" required placeholder="0.00">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Calcular y Guardar Impuesto</button>
                        </form>
                    </div>
                </div>

            </div>

            <!-- Columna Derecha: Tablas de Información -->
            <div class="col-lg-7">
                
                <!-- Tabla 1: Listado de Clientes registrados -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Clientes Registrados</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>NIT</th>
                                        <th>Tipo</th>
                                        <th>Email</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaClientesBody">
                                    <!-- Datos dinámicos cargados con app.js -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tabla 2: Historial de Impuestos calculados -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="card-title mb-0">Historial de Impuestos Calculados</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Cliente</th>
                                        <th>Período</th>
                                        <th>Activos</th>
                                        <th>Ingresos</th>
                                        <th>Impuesto</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaPeriodosBody">
                                    <!-- Datos dinámicos cargados con app.js -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de integración con el Backend -->
    <script src="app.js"></script>
</body>
</html>
