<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Impuestos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 320px; }
        .login-box h2 { margin-bottom: 20px; text-align: center; font-size: 22px; color: #333; }
        .login-box label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .login-box input { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .login-box button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
            <label>Usuario:</label>
            <input type="text" id="usuario" required>
            
            <label>Clave:</label>
            <input type="password" id="clave" required>
            
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById("formLogin").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const datos = {
                usuario: document.getElementById("usuario").value,
                clave: document.getElementById("clave").value
            };

            try {
                const respuesta = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();
                
                if (resultado.status === "ok") {
                    // Guardamos la sesión exactamente como la requiere el sistema
                    localStorage.setItem("usuarioLogueado", JSON.stringify(resultado.usuario));
                    window.location.href = "/sistema";
                } else {
                    alert(resultado.msg || "Acceso denegado");
                }
            } catch (error) {
                console.error("Error en la petición:", error);
                alert("Error al conectar con el servidor.");
            }
        });
    </script>
</body>
</html>
